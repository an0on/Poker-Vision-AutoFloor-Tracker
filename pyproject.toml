[project]
name = "poker-vision"
version = "0.1.0"
description = "Local CV pipeline for poker table analysis (seat occupancy, dealer button, board state)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_vision"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Pre-existing scripts slated for archival/replacement under later PRD
# requirements (REQ-6/8/9/10/43); out of scope for REQ-1.
extend-exclude = ["overlays/scripts", "phase0_poc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
