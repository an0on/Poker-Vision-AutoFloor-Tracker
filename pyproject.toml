[project]
name = "poker-vision"
version = "0.1.0"
description = "Local CV pipeline for poker table analysis (seat occupancy, dealer button, board state)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    # ultralytics hard-depends on plain opencv-python (not headless); both
    # packages install into the same `cv2/` path, so keeping the headless
    # variant here would make the actually-active build install-order
    # dependent. No code path uses cv2 GUI functions (debug/ serves MJPEG,
    # not cv2.imshow), so this has no functional effect.
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
poker-vision = "poker_vision.runner.cli:entry_point"
calib = "poker_vision.calibration.cli:entry_point"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_vision"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Phase 0's approved, standalone proof-of-concept script (REQ-0.1-REQ-0.9);
# frozen as-is per the Phase-0-Freigabe in PRD.md, not part of the src/
# package's conventions.
extend-exclude = ["phase0_poc.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
