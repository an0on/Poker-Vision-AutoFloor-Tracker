<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Poker Vision - Debug</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111417;
    --panel: #1a1e23;
    --border: #2b3138;
    --text: #e6e9ec;
    --muted: #8a939c;
    --accent: #4da3ff;
    --ok: #3ecf8e;
    --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
  }
  #ws-status {
    font-size: 0.8rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    border: 1px solid var(--border);
  }
  #ws-status[data-state="connected"] { color: var(--ok); border-color: var(--ok); }
  #ws-status[data-state="disconnected"] { color: var(--bad); border-color: var(--bad); }
  #ws-status[data-state="connecting"] { color: var(--muted); }
  main {
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
    gap: 1rem;
    padding: 1rem;
    align-items: start;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .panel h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0;
    padding: 0.6rem 0.8rem;
    border-bottom: 1px solid var(--border);
  }
  #stream {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
  }
  #snapshot {
    padding: 0.6rem 0.8rem;
    font-size: 0.85rem;
  }
  #snapshot table { width: 100%; border-collapse: collapse; }
  #snapshot td { padding: 0.15rem 0; }
  #snapshot td.key { color: var(--muted); width: 45%; }
  #seat-table { margin-top: 0.5rem; width: 100%; border-collapse: collapse; }
  #seat-table td, #seat-table th { padding: 0.15rem 0.3rem; text-align: left; font-size: 0.8rem; }
  #seat-table th { color: var(--muted); font-weight: 500; }
  .occupied { color: var(--ok); }
  .vacant { color: var(--muted); }
  #events {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 60vh;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.78rem;
  }
  #events li {
    padding: 0.4rem 0.8rem;
    border-bottom: 1px solid var(--border);
    white-space: pre-wrap;
    word-break: break-word;
  }
  #events li .seq { color: var(--muted); }
  #events li .type { color: var(--accent); font-weight: 600; }
  #events:empty::after {
    content: "waiting for events...";
    display: block;
    padding: 0.8rem;
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>
<header>
  <h1>Poker Vision - Debug</h1>
  <span id="ws-status" data-state="connecting">connecting...</span>
</header>
<main>
  <section class="panel">
    <h2>MJPEG Overlay</h2>
    <img id="stream" src="/mjpeg" alt="Live debug overlay stream">
  </section>
  <div style="display: flex; flex-direction: column; gap: 1rem;">
    <section class="panel">
      <h2>State Snapshot</h2>
      <div id="snapshot">no snapshot yet</div>
    </section>
    <section class="panel">
      <h2>Events</h2>
      <ul id="events"></ul>
    </section>
  </div>
</main>
<script>
(() => {
  "use strict";

  const WS_PORT = {{WS_PORT}};
  const MAX_EVENTS = 500;

  const statusEl = document.getElementById("ws-status");
  const snapshotEl = document.getElementById("snapshot");
  const eventsEl = document.getElementById("events");

  function setStatus(state, label) {
    statusEl.dataset.state = state;
    statusEl.textContent = label;
  }

  function renderSnapshot(snapshot) {
    const seatRows = snapshot.seats
      .map((seat) => {
        const cls = seat.occupied ? "occupied" : "vacant";
        return `<tr><td>${seat.seat}</td><td class="${cls}">${seat.occupied ? "occupied" : "vacant"}</td></tr>`;
      })
      .join("");
    snapshotEl.innerHTML = `
      <table>
        <tr><td class="key">frame_index</td><td>${snapshot.frame_index}</td></tr>
        <tr><td class="key">dealer_seat</td><td>${snapshot.dealer_seat ?? "-"}</td></tr>
        <tr><td class="key">hand_id</td><td>${snapshot.hand_id ?? "-"}</td></tr>
        <tr><td class="key">street</td><td>${snapshot.street ?? "-"}</td></tr>
        <tr><td class="key">hand_active</td><td>${snapshot.hand_active}</td></tr>
      </table>
      <table id="seat-table">
        <tr><th>seat</th><th>occupancy</th></tr>
        ${seatRows}
      </table>
    `;
  }

  function describeEvent(event) {
    const { schema_version, event_type, sequence, timestamp, frame_index, ...rest } = event;
    const fields = Object.entries(rest)
      .map(([key, value]) => `${key}=${value}`)
      .join(" ");
    return `<span class="seq">#${sequence}</span> <span class="type">${event_type}</span> frame=${frame_index} ${fields}`;
  }

  function addEvent(event) {
    const li = document.createElement("li");
    li.innerHTML = describeEvent(event);
    eventsEl.prepend(li);
    while (eventsEl.childElementCount > MAX_EVENTS) {
      eventsEl.removeChild(eventsEl.lastChild);
    }
  }

  function connect() {
    setStatus("connecting", "connecting...");
    const protocol = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${protocol}://${location.hostname}:${WS_PORT}/ws`);

    ws.onopen = () => setStatus("connected", "connected");
    ws.onclose = () => {
      setStatus("disconnected", "disconnected - retrying...");
      setTimeout(connect, 1000);
    };
    ws.onerror = () => ws.close();
    ws.onmessage = (message) => {
      const data = JSON.parse(message.data);
      if ("event_type" in data) {
        addEvent(data);
      } else {
        renderSnapshot(data);
      }
    };
  }

  connect();
})();
</script>
</body>
</html>
